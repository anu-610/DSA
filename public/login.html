<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AlgoStudy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #1e1e2e;
      --border-hover: #2e2e4a;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --primary: #6366f1;
      --primary-hover: #4f52e0;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --error: #f87171;
      --success: #34d399;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Subtle animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(99,102,241,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(139,92,246,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
      animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 20px var(--primary-glow);
    }

    .logo-text h1 {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(135deg, #e2e8f0, #94a3b8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .logo-text p {
      font-size: 12px; color: var(--text-muted); margin-top: 1px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px; font-weight: 500;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px; font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder { color: var(--text-muted); }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: rgba(99,102,241,0.05);
    }

    .form-input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(248,113,113,0.15);
    }

    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      border: none; border-radius: var(--radius);
      color: #fff; font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: all 0.2s;
      position: relative; overflow: hidden;
      box-shadow: 0 4px 20px var(--primary-glow);
    }

    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 30px var(--primary-glow); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-login .btn-text { transition: opacity 0.2s; }
    .btn-login.loading .btn-text { opacity: 0; }

    .btn-spinner {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
    }
    .btn-login.loading .btn-spinner { display: flex; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.25);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px; color: var(--error);
      margin-bottom: 16px;
      display: none;
      animation: shake 0.4s ease;
    }
    .error-banner.show { display: block; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .divider {
      height: 1px; background: var(--border);
      margin: 28px 0 20px;
    }

    .footer-note {
      text-align: center;
      font-size: 12px; color: var(--text-muted);
    }

    /* password visibility toggle */
    .input-wrapper { position: relative; }

    .input-wrapper .form-input { padding-right: 44px; }

    .eye-btn {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 4px;
      transition: color 0.2s; display: flex;
    }
    .eye-btn:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-text">
        <h1>AlgoStudy</h1>
        <p>DSA Progress Dashboard</p>
      </div>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <form id="login-form" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input
          id="username"
          class="form-input"
          type="text"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <input
            id="password"
            class="form-input"
            type="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="eye-btn" id="eye-btn" title="Toggle visibility">
            <svg id="eye-open" width="18" height="18" viewBox="0 0 18 18" fill="none" display="none">
              <path d="M1 9C1 9 4 3 9 3C14 3 17 9 17 9C17 9 14 15 9 15C4 15 1 9 1 9Z" stroke="currentColor" stroke-width="1.4"/>
              <circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <svg id="eye-closed" width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M2 2L16 16M7.5 7.8C7.2 8.1 7 8.5 7 9C7 10.1 7.9 11 9 11C9.5 11 9.9 10.8 10.2 10.5M5 5.3C3.4 6.4 2 8 1 9C1 9 4 15 9 15C10.8 15 12.4 14.3 13.7 13.3M8 4.1C8.3 4 8.7 4 9 4C14 4 17 9 17 9C16.6 9.8 16 10.7 15.3 11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="login-btn">
        <span class="btn-text">Sign In</span>
        <span class="btn-spinner"><div class="spinner"></div></span>
      </button>
    </form>

    <div class="divider"></div>
    <p class="footer-note">Your personal DSA study tracker</p>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-btn');
    const errorBanner = document.getElementById('error-banner');
    const eyeBtn = document.getElementById('eye-btn');
    const pwdInput = document.getElementById('password');
    const eyeOpen = document.getElementById('eye-open');
    const eyeClosed = document.getElementById('eye-closed');

    // Toggle password visibility
    eyeBtn.addEventListener('click', () => {
      const isHidden = pwdInput.type === 'password';
      pwdInput.type = isHidden ? 'text' : 'password';
      eyeOpen.style.display = isHidden ? 'block' : 'none';
      eyeClosed.style.display = isHidden ? 'none' : 'block';
    });

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add('show');
      document.getElementById('username').classList.remove('error');
      document.getElementById('password').classList.remove('error');
      document.getElementById('username').classList.add('error');
      document.getElementById('password').classList.add('error');
    }

    function setLoading(v) {
      btn.disabled = v;
      btn.classList.toggle('loading', v);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.classList.remove('show');
      document.getElementById('username').classList.remove('error');
      document.getElementById('password').classList.remove('error');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) { showError('Please enter username and password.'); return; }

      setLoading(true);
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'include',
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          showError(data.error || 'Login failed. Please try again.');
        }
      } catch {
        showError('Network error. Please try again.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
